# Cloudflare Worker names cannot contain a dot, so the Worker for timelock.dev is named timelock-dev.
name = "timelock-dev"
# Reed Technology Solutions, LLC. This account owns the timelock-events D1 database.
account_id = "08638017ebadc8e5b43fe6a8e3f881d8"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Deploying with this line attaches the timelock.dev custom domain to this Worker and takes it away from any other Worker
# that holds it, without asking when run in CI. Leave it commented out until this Worker has been checked on workers.dev.
# routes = [{ pattern = "timelock.dev", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "timelock-events"
database_id = "d53294f6-644e-4afc-82cb-40f0e421d1c9"
migrations_dir = "migrations"

# Per-IP limit on creating hosted message links (POST /api/messages). The key is counted at Cloudflare's edge and is not stored by the app.
[[ratelimits]]
name = "MESSAGE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Workers Logs stay off: the site keeps no request logs (see Privacy in README.md).
[observability]
enabled = false
